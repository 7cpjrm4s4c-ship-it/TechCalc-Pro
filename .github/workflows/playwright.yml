name: Playwright Tests

on:
  push:
    branches:
      - main
      - Feature/Überflutungsnachweis

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Node.js installieren
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps

      - name: Release-Artefakte synchronisieren
        run: npm run precache

      - name: Versions- und Release-Verträge prüfen
        run: |
          npm run version:check
          npm run audit:release-readiness

      - name: Statische Prüfungen
        run: npm run lint

      - name: Unit- und Integrationstests
        run: |
          npm test
          npm run test:f-gases
          npm run test:flooding
          npm run test:integration

      - name: Anwendung bauen
        run: |
          npm run build
          npm run precache:check

      - name: Playwright-Tests ausführen
        run: npm run test:e2e

      - name: Kompakten Playwright-Fehlerbericht speichern
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-ci-failures
          path: test-results/playwright-ci-failures.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Playwright-Bericht speichern
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            docs/audits/playwright-report-phase47d/
            test-results/
          retention-days: 30
          if-no-files-found: warn
